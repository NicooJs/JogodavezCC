<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Histórico de leilões</title>
<meta name="referrer" content="no-referrer" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600;1,9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css" />
<link rel="stylesheet" href="/css/history.css" />
</head>
<body class="history-body">
  <div class="history-page">
    <header class="topbar history-topbar">
      <p class="topbar-mark">
        <span class="brand-word" id="history-title">Histórico de leilões</span>
      </p>
      <a class="presenter-bar-link" href="#" id="back-link">← voltar pro leilão</a>
    </header>

    <main class="history-main">
      <p class="history-empty" id="history-list-empty" hidden>Nenhum leilão zerado ainda — assim que você usar "zerar leilão", os rounds anteriores aparecem aqui.</p>
      <div class="history-grid" id="history-grid"></div>
    </main>
  </div>

  <div class="recap-overlay" id="recap-overlay" hidden>
    <div class="recap-modal" role="dialog" aria-modal="true" aria-labelledby="recap-title">
      <button class="recap-close" id="recap-close" type="button" aria-label="Fechar">✕</button>
      <p class="recap-eyebrow" id="recap-eyebrow">leilão encerrado</p>
      <h2 class="recap-title" id="recap-title">Leilão de Jogos</h2>

      <div class="recap-stats">
        <div class="recap-stat">
          <span class="recap-stat-value" id="recap-total">R$ 0</span>
          <span class="recap-stat-label">arrecadado</span>
        </div>
        <div class="recap-stat">
          <span class="recap-stat-value" id="recap-duration">—</span>
          <span class="recap-stat-label">duração</span>
        </div>
        <div class="recap-stat">
          <span class="recap-stat-value" id="recap-donors">0</span>
          <span class="recap-stat-label">apoiadores</span>
        </div>
        <div class="recap-stat">
          <span class="recap-stat-value" id="recap-games">0</span>
          <span class="recap-stat-label">lotes disputados</span>
        </div>
      </div>

      <p class="recap-section-label">TOP 3</p>
      <div class="recap-podium" id="recap-podium"></div>

      <p class="recap-section-label" id="recap-donors-label" hidden>maiores apoiadores</p>
      <div class="recap-donor-list" id="recap-donor-list"></div>
    </div>
  </div>

  <script src="/js/history.js"></script>
</body>
</html>
