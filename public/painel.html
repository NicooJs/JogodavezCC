<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JogodaVez</title>
<link rel="icon" href="/favicon.png" type="image/png" />
<link rel="icon" sizes="32x32" href="/favicon-32.png" type="image/png" />
<link rel="apple-touch-icon" href="/favicon-180.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css" />
<link rel="stylesheet" href="/css/settings.css" />
<link rel="stylesheet" href="/css/historico.css" />
<link rel="stylesheet" href="/css/perfil.css" />
<link rel="stylesheet" href="/css/hub.css" />
</head>
<body class="hub-body">

  <div class="hub-logged-out" id="hub-logged-out" hidden>
    <p class="hub-title">Entre com a Twitch pra abrir seu painel</p>
    <p class="hub-lede">Leilão, reacts e o que mais vier depois -- tudo fica junto aqui, por conta.</p>
    <a class="create-twitch-login" id="hub-login-link" href="/auth/twitch/start?returnTo=/painel">
      <svg class="icon" viewBox="0 0 2400 2800" fill="currentColor" aria-hidden="true"><path d="M500 0 0 500v1800h600v500l500-500h400l900-900V0H500zm1600 1300-400 400h-400l-350 350v-350H500V200h1600v1100z" /><path d="M1700 550h200v600h-200zM1150 550h200v600h-200z" /></svg>
      Continuar com a Twitch
    </a>
  </div>

  <div class="hub-shell" id="hub-shell" hidden>
    <aside class="hub-sidebar" id="sidebar-root"></aside>

    <main class="hub-main">
      <div class="hub-view" id="view-home">
        <div class="hub-header">
          <p class="hub-eyebrow">JogodaVez</p>
          <h1 class="hub-title" id="hub-greeting">Painel</h1>
          <p class="hub-lede">Escolha uma ferramenta pra abrir.</p>
        </div>

        <p class="hub-section-label">Ferramentas</p>
        <div class="hub-service-grid" id="hub-service-grid"></div>
      </div>

      <div class="hub-view" id="view-perfil" hidden>
        <div id="perfil-root">
          <p class="hub-modal-loading">Carregando…</p>
        </div>
      </div>

      <div class="hub-view" id="view-config" hidden>
        <div class="hub-view-config" id="settings-root">
          <p class="hub-modal-loading">Carregando…</p>
        </div>
      </div>

      <div class="hub-view" id="view-historico" hidden>
        <div id="historico-root">
          <p class="hub-modal-loading">Carregando…</p>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/painel.js"></script>
</body>
</html>
